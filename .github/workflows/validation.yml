name: WURI validation

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'security/**'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-test.txt
      - name: Compile Python source and tests
        run: python -m compileall -q backend/app backend/tests
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  frontend-validation:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply semver-safe dependency audit fixes to lockfile
        working-directory: university-ranking-dss
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Install frontend dependencies
        working-directory: university-ranking-dss
        run: npm ci
      - name: Report npm dependency advisories
        working-directory: university-ranking-dss
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = JSON.parse(require("fs").readFileSync("npm-audit.json", "utf8")); console.log("Totals:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ": " + JSON.stringify(item, null, 2));'
      - name: Upload dependency remediation preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wuri-dependency-remediation-preview
          path: |
            university-ranking-dss/package-lock.json
            university-ranking-dss/npm-audit.json
          retention-days: 1
      - name: Run ESLint
        working-directory: university-ranking-dss
        run: npm run lint
      - name: Build frontend
        working-directory: university-ranking-dss
        run: npm run build
